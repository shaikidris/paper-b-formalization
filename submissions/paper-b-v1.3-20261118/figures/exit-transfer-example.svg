<text x="252" y="124" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" font-style="italic" fill="#141920">V</text>
<circle id="G-vertex-ℓ" cx="131" cy="182" r="13" fill="white" stroke="#323b46" stroke-width="1.35"/>
<text x="131" y="187" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" font-style="italic" fill="#141920">ℓ</text>
<circle id="G-vertex-h" cx="49" cy="182" r="13" fill="white" stroke="#323b46" stroke-width="1.35"/>
<text x="49" y="187" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" font-style="italic" fill="#141920">h</text>
<circle id="G-vertex-p" cx="208" cy="251" r="13" fill="white" stroke="#323b46" stroke-width="1.35"/>
<text x="208" y="256" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" font-style="italic" fill="#141920">p</text>
<circle id="G-vertex-y" cx="113" cy="319" r="13" fill="white" stroke="#323b46" stroke-width="1.35"/>
<text x="113" y="324" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" font-style="italic" fill="#141920">y</text>
<circle id="H-vertex-r" cx="472" cy="57" r="13" fill="white" stroke="#323b46" stroke-width="1.35"/>
<text x="472" y="62" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" font-style="italic" fill="#141920">r</text>
<circle id="H-vertex-U" cx="400" cy="119" r="13" fill="white" stroke="#323b46" stroke-width="1.35"/>
<text x="400" y="124" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" font-style="italic" fill="#141920">U</text>
<circle id="H-vertex-V" cx="567" cy="119" r="13" fill="white" stroke="#323b46" stroke-width="1.35"/>
<text x="567" y="124" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" font-style="italic" fill="#141920">V</text>
<circle id="H-vertex-p" cx="514" cy="245" r="13" fill="white" stroke="#323b46" stroke-width="1.35"/>
<text x="514" y="250" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" font-style="italic" fill="#141920">p</text>
<circle id="H-vertex-y" cx="436" cy="319" r="13" fill="white" stroke="#323b46" stroke-width="1.35"/>
<text x="436" y="324" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="16" font-style="italic" fill="#141920">y</text>
<g font-family="Georgia, Times New Roman, serif" font-size="19" font-style="italic" text-anchor="middle">
<text x="469" y="168" fill="#185f8e">ℓ</text>
<text x="400" y="221" fill="#a54e24">h</text>
</g>
</svg>
